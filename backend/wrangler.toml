name = "rohini-xerox-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
ADMIN_UIDS = "REPLACE_WITH_ADMIN_FIREBASE_UID"
RAZORPAY_KEY_ID = "REPLACE_WITH_RAZORPAY_KEY_ID"

[[d1_databases]]
binding = "DB"
database_name = "rohini-orders"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "rohini-documents"
